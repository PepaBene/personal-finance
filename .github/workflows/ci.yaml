name: CI

on:
  push:
    branches: [main]
  pull_request:

# Codegen (drift/freezed/riverpod) runs in CI before analyze/test — generated
# files are not committed (docs/13 §3.2).
env:
  FLUTTER_CHANNEL: stable

jobs:
  static:
    name: Analyze, format & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: dart pub global activate melos
      - run: melos bootstrap
      - name: Codegen (build_runner)
        run: melos run generate
      - name: Localization
        run: melos run gen-l10n
      - name: Format check
        run: melos run format
      - name: Analyze
        run: melos run analyze
      - name: Test (unit + widget + golden)
        run: melos run test

  build_web:
    name: Build Web (PWA)
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos run generate
      - run: melos run gen-l10n
      - name: Generate platform runners
        working-directory: app
        run: flutter create --platforms=web --org com.ledgerly --project-name ledgerly_app .
      - name: Build web
        working-directory: app
        run: flutter build web --release

  build_android:
    name: Build Android (AAB)
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos run generate
      - run: melos run gen-l10n
      - name: Generate platform runners
        working-directory: app
        run: flutter create --platforms=android --org com.ledgerly --project-name ledgerly_app .
      - name: Build appbundle (debug signing — release signing in Phase 4)
        working-directory: app
        run: flutter build appbundle --debug

  build_desktop:
    name: Build macOS (desktop target)
    runs-on: macos-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos run generate
      - run: melos run gen-l10n
      - name: Generate platform runners
        working-directory: app
        run: flutter create --platforms=macos --org com.ledgerly --project-name ledgerly_app .
      - name: Build macOS
        working-directory: app
        run: flutter build macos --debug
