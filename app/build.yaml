# build_runner configuration for codegen (drift tables + freezed entities).
# Run: dart run build_runner build --delete-conflicting-outputs
targets:
  $default:
    builders:
      drift_dev:
        options:
          # Stored money as TEXT decimal, dates as ISO-8601 UTC text — see docs/04.
          store_date_time_values_as_text: true
          named_parameters: true
          sql:
            dialect: sqlite
            options:
              version: "3.39"
