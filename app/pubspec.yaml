name: ledgerly_app
description: "Ledgerly — offline-first, encrypted, cloud-synced personal finance app."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State / DI / navigation ---
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # --- Local DB (Drift over the PowerSync-managed SQLite store) ---
  drift: ^2.23.0
  drift_sqlite_async: ^0.2.1        # runs Drift on top of the PowerSync DB
  sqlite_async: ^0.11.5             # SqliteConnection / open-factory types
  # Pin to 2.8.x: sqlite_async 0.11.x doesn't implement the abstract members
  # sqlite3 2.9 added to CommonDatabase (only fails on the web worker path).
  sqlite3: ">=2.8.0 <2.9.0"
  sqlcipher_flutter_libs: ^0.6.4    # SQLCipher native libs (encryption)
  path_provider: ^2.1.4
  path: ^1.9.0

  # --- Cloud + sync ---
  supabase_flutter: ^2.6.0
  powersync: ^1.9.0

  # --- Auth / crypto / secure storage ---
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  cryptography: ^2.7.0 # AES-GCM, Argon2id, HKDF

  # --- Models / money / utils ---
  freezed_annotation: ^3.0.0
  decimal: ^3.0.2
  rational: ^2.2.3 # exact ratio math for per-line base attribution
  meta: ^1.15.0
  uuid: ^4.5.0
  # Charts (pure-Dart, all platforms) — styled from design tokens (FR-ANL-10).
  fl_chart: ^0.69.0
  intl: ^0.20.2 # must match flutter_localizations' pin (Flutter stable)
  logger: ^2.4.0
  csv: ^6.0.0          # CSV import/export (FR-DAT-04/05)
  file_picker: ^8.1.2  # pick/save files for import/export

  # --- Design system (workspace package) ---
  design_system:
    path: ../packages/design_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Codegen: Drift tables + Freezed entities only (providers are hand-written;
  # no JSON or riverpod codegen). Versions track the current stable SDK.
  build_runner: ^2.4.13
  drift_dev: ^2.23.0
  freezed: ^3.0.0

  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true # enables flutter gen-l10n from l10n.yaml
